name: GitHub Pages

on:
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Build CV
      if: github.event.action != 'closed'
      uses: xu-cheng/latex-action@v4
      with:
        root_file: cv.tex
        working_directory: cv
        texlive_version: '2023'
    - name: Check the CV is 2 pages and add it to the site
      if: github.event.action != 'closed'
      run: |
        grep -q 'Output written on cv.pdf (2 pages' cv/cv.log || { echo "::error::cv.pdf is not 2 pages"; exit 1; }
        cp cv/cv.pdf static/cv.pdf
    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        extended: true
    - name: Build
      if: github.event.action != 'closed'
      run: hugo -b https://arnostrouwen.github.io/arnostrouwen.com/pr-preview/pr-${{ github.event.pull_request.number }}/
    - name: Deploy preview
      uses: rossjrw/pr-preview-action@v1
      with:
        source-dir: ./public/