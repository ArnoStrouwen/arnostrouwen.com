name: Publish Website to CPanel
on:
  push:
    branches:
      - main
jobs:
  FTP-Deploy-Action:
    name: FTP-Deploy-Action
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Build CV
      uses: xu-cheng/latex-action@v4
      with:
        root_file: cv.tex
        working_directory: cv
        texlive_version: '2023'
    - name: Check the CV is 2 pages and add it to the site
      run: |
        grep -q 'Output written on cv.pdf (2 pages' cv/cv.log || { echo "::error::cv.pdf is not 2 pages"; exit 1; }
        cp cv/cv.pdf static/cv.pdf
    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        extended: true
    - name: Build
      run: hugo --minify
    - name: FTP-Deploy-Action
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./public/